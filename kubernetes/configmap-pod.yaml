apiVersion: v1
kind: Pod

metadata:
  name: configmap-demo
  labels:
    app: configmap-demo

spec:
  containers:
    - name: busybox
      image: busybox:1.35
      imagePullPolicy: IfNotPresent

      command:
        - sh
        - -c
        - env && sleep 3600

      envFrom:
        - configMapRef:
            name: app-config

      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false

  restartPolicy: Always