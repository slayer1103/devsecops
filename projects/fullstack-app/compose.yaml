services:
  backend:
    build: ./backend
    ports:
      - "6000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend